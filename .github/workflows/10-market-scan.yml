name: 全市场扫描观察名单

# 用内置选股引擎做全市场扫描，把候选沉淀成 data/watchlist/ 下的观察名单。
# 频率按策略 YAML 的 style.holding_period 分层：
#   short_term            → daily  （每交易日收盘后）
#   swing / watchlist     → weekly （每周五收盘后）
# 详见 docs/screening-engine.md 的「全市场扫描与观察名单」。

on:
  schedule:
    # 每周一至周五 UTC 09:30 = 北京时间 17:30（收盘后），跑 daily 组
    - cron: '30 9 * * 1-5'
    # 每周五 UTC 10:30 = 北京时间 18:30，跑 weekly 组
    - cron: '30 10 * * 5'

  workflow_dispatch:
    inputs:
      cadence:
        description: '扫描频率分层'
        required: true
        default: 'weekly'
        type: choice
        options:
          - weekly
          - daily
          - all
      strategies:
        description: '显式指定策略（逗号分隔，留空则按 cadence 分层）'
        required: false
        default: ''
        type: string
      force_run:
        description: '强制运行（跳过交易日检查）'
        required: false
        default: false
        type: boolean
      dry_run:
        description: '试跑（照常扫描，但不写文件/不落库/不推送/不提交）'
        required: false
        default: false
        type: boolean
      refresh_industry_map:
        description: '强制重建行业成分映射（约 162 次 akshare 请求；日常无需勾选，TTL 会自然过期）'
        required: false
        default: false
        type: boolean

# 同一时间只跑一轮扫描：daily 与 weekly 在周五会同时触发，串行执行避免名单写冲突。
concurrency:
  group: market-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.MARKET_SCAN_TIMEOUT_MINUTES || '60') }}

    steps:
      - name: 解析本次扫描计划
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 按触发本次运行的 cron 表达式区分分层；新增 cron 时必须同步这里。
            case "${{ github.event.schedule }}" in
              "30 10 * * 5") CADENCE=weekly ;;
              *)             CADENCE=daily ;;
            esac
            DRY_RUN=false
            FORCE_RUN=false
          else
            CADENCE="${{ github.event.inputs.cadence }}"
            DRY_RUN="${{ github.event.inputs.dry_run }}"
            FORCE_RUN="${{ github.event.inputs.force_run }}"
          fi
          echo "cadence=${CADENCE:-weekly}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN:-false}" >> "$GITHUB_OUTPUT"
          echo "force_run=${FORCE_RUN:-false}" >> "$GITHUB_OUTPUT"
          echo "🎯 分层: ${CADENCE:-weekly} | 试跑: ${DRY_RUN:-false} | 强制: ${FORCE_RUN:-false}"

      - name: 随机延迟（避免固定时间访问数据源）
        run: sleep $((RANDOM % 60))

      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建必要目录
        run: mkdir -p data/watchlist/cache/industry logs

      - name: 按需重建行业成分映射
        # 过期判定已改用缓存 JSON 里的 created_at（不再依赖会被 checkout 重置的 mtime），
        # 所以两级缓存都会自然过期。这一步只用于在 720 小时 TTL 到期前手动重建成分映射，
        # 例如板块成分发生了较大调整。只删 *.json，保留 *.history.jsonl 的热度历史。
        if: github.event.inputs.refresh_industry_map == 'true'
        run: |
          rm -f data/watchlist/cache/industry/*.json
          echo "🔄 已清除行业缓存（保留热度历史），本次运行将重新拉取成分与热度"

      - name: 执行全市场扫描
        env:
          # ===== 选股引擎开关 =====
          SCREENING_ENABLED: 'true'

          # ===== 全市场快照数据源 =====
          # 留空时引擎按是否配置 TUSHARE_TOKEN 自动注入优先级，通常不需要固定值。
          SNAPSHOT_SOURCE_PRIORITY: ${{ vars.SNAPSHOT_SOURCE_PRIORITY }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          SCREENING_SNAPSHOT_CALL_TIMEOUT_SEC: ${{ vars.SCREENING_SNAPSHOT_CALL_TIMEOUT_SEC || '60' }}
          SCREENING_DAILY_CALL_TIMEOUT_SEC: ${{ vars.SCREENING_DAILY_CALL_TIMEOUT_SEC || '20' }}
          SCREENING_SNAPSHOT_CACHE_TTL_SEC: ${{ vars.SCREENING_SNAPSHOT_CACHE_TTL_SEC || '900' }}

          # ===== 日线补齐 =====
          # low_volatility_quality / shrink_pullback / volume_breakout 的硬过滤需要日 K 特征，
          # pipeline 会为它们强制补齐；因此这里保持默认关闭，避免另外 7 个只吃快照的策略
          # 也各自拉最多 DAILY_ENRICH_MAX_CANDIDATES 条历史。逐只拉取是本工作流最主要的耗时来源，
          # 日 K 缓存跨策略复用。设为 true 可让所有策略的评分都带上日线特征，代价是耗时数倍增长。
          DAILY_ENRICH_ENABLED: ${{ vars.DAILY_ENRICH_ENABLED || 'false' }}
          DAILY_ENRICH_MAX_CANDIDATES: ${{ vars.DAILY_ENRICH_MAX_CANDIDATES || '100' }}
          DAILY_FETCH_MAX_WORKERS: ${{ vars.DAILY_FETCH_MAX_WORKERS || '2' }}
          SCREENING_DAILY_HISTORY_CACHE_TTL_HOURS: ${{ vars.SCREENING_DAILY_HISTORY_CACHE_TTL_HOURS || '24' }}

          # ===== 行业/概念 =====
          # 必须开启：快照源 em_datacenter 的 sty 参数不请求任何行业字段，
          # 没有行业数据时策略内的 portfolio_profile 会整个空转、theme_heat 退化成常数、
          # 观察名单的行业配额也无从分组。
          #
          # 缓存分两级（见 docs/screening-engine.md「行业数据的两级缓存」）：
          #   成分映射  最多 162 次请求，月度才变 → TTL 720 小时
          #   板块热度  仅 2 次请求，每天都变     → TTL 20 小时（跨一个交易日，不跨两个）
          # 每次热度刷新还会向 .history.jsonl 追加一行，喂 board_heat_trend/persistence/cooling。
          INDUSTRY_PROVIDER: ${{ vars.INDUSTRY_PROVIDER || 'akshare' }}
          INDUSTRY_PROVIDER_MAX_BOARDS: ${{ vars.INDUSTRY_PROVIDER_MAX_BOARDS || '80' }}
          SCREENING_INDUSTRY_PROVIDER_CACHE_DIR: data/watchlist/cache/industry
          SCREENING_INDUSTRY_PROVIDER_CACHE_TTL_HOURS: ${{ vars.SCREENING_INDUSTRY_PROVIDER_CACHE_TTL_HOURS || '20' }}
          SCREENING_INDUSTRY_CONSTITUENTS_CACHE_TTL_HOURS: ${{ vars.SCREENING_INDUSTRY_CONSTITUENTS_CACHE_TTL_HOURS || '720' }}

          # ===== 观察名单 =====
          WATCHLIST_DIR: data/watchlist
          WATCHLIST_CADENCE_MAP: ${{ vars.WATCHLIST_CADENCE_MAP }}
          # 三个限额都按 style.risk_profile 分桶独立结算，留空则用各桶默认值。
          WATCHLIST_TTL_DAYS: ${{ vars.WATCHLIST_TTL_DAYS || 'defensive:45,balanced:30,aggressive:14' }}
          WATCHLIST_MAX_SIZE: ${{ vars.WATCHLIST_MAX_SIZE || 'defensive:25,balanced:20,aggressive:15' }}
          # 跨策略行业配额：7 个策略各选 1 只银行时，名单里只留分最高的 2 只。
          WATCHLIST_MAX_PER_INDUSTRY: ${{ vars.WATCHLIST_MAX_PER_INDUSTRY || 'defensive:2,balanced:2,aggressive:4' }}

          # ===== 通知渠道（仅在 WATCHLIST_NOTIFY=true 时实际发送）=====
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          FEISHU_WEBHOOK_KEYWORD: ${{ vars.FEISHU_WEBHOOK_KEYWORD || secrets.FEISHU_WEBHOOK_KEYWORD }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          NOTIFICATION_REPORT_CHANNELS: ${{ vars.NOTIFICATION_REPORT_CHANNELS }}

          # ===== 落库（默认 SQLite，runner 上是一次性的；配置外部库才有持久价值）=====
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          CADENCE: ${{ steps.plan.outputs.cadence }}
          DRY_RUN: ${{ steps.plan.outputs.dry_run }}
          FORCE_RUN: ${{ steps.plan.outputs.force_run }}
          EXPLICIT_STRATEGIES: ${{ github.event.inputs.strategies }}
          # 观察名单报告邮件是本工作流的主要产出，默认发送。
          WATCHLIST_NOTIFY: ${{ vars.WATCHLIST_NOTIFY || 'true' }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          ARGS=(--cadence "$CADENCE" --market cn --save-db)

          if [ -n "${EXPLICIT_STRATEGIES:-}" ]; then
            ARGS+=(--strategies "$EXPLICIT_STRATEGIES")
          fi
          if [ "${FORCE_RUN:-false}" = "true" ]; then
            ARGS+=(--force-run)
          fi
          if [ "${DRY_RUN:-false}" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          echo "=========================================="
          echo "🔍 全市场扫描 · 观察名单"
          echo "⏰ $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S') (北京时间)"
          echo "🎯 分层: $CADENCE"
          echo "🧠 LLM 重排: 关闭（纯因子排序）"
          echo "🗄️ 数据库: $([ -n "$DATABASE_URL" ] && echo '外部库' || echo '本地 SQLite（本次运行后丢弃）')"
          echo "=========================================="

          python scripts/market_scan.py "${ARGS[@]}" 2>&1 | tee logs/market_scan.log

      - name: 提交观察名单
        if: steps.plan.outputs.dry_run != 'true'
        env:
          CADENCE: ${{ steps.plan.outputs.cadence }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watchlist
          if git diff --staged --quiet; then
            echo "观察名单无变化，跳过提交"
            exit 0
          fi
          RUN_DATE="$(TZ='Asia/Shanghai' date '+%Y-%m-%d')"
          git commit -m "chore: refresh ${CADENCE} market scan watchlist (${RUN_DATE})"
          # 并发的 daily/weekly 运行可能已经推过一次，rebase 后重试一次再放弃。
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 上传扫描产物
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: market-scan-${{ steps.plan.outputs.cadence }}-${{ github.run_number }}
          path: |
            data/watchlist/
            logs/
          retention-days: 30

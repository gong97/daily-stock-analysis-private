# 蓝筹收益质量策略
name: blue_chip_income
display_name: 蓝筹收益质量
description: 面向高流动性大盘蓝筹的收益质量候选，强调合理估值、稳定成交和防守型持有体验
version: "1.0"
category: income
tags: [value, quality, income, blue_chip, defensive, snapshot_only]
style:
  risk_profile: defensive
  holding_period: watchlist
  execution_style: income_quality
  market_regime: [risk_off, range_bound, low_rate]
  capital_profile: high_liquidity
  ui_badge: 蓝筹收益

screening:
  enabled: true
  market_scope: [cn]
  hard_filters:
    exclude_st: true
    amount_min: 120000000
    market_cap_min: 30000000000
    pe_ttm_min: 0
    pe_ttm_max: 22
    pb_min: 0
    pb_max: 3.2
    # 刻意不设 turnover_rate_min：大盘蓝筹的低换手率来自巨大流通盘，不是流动性差。
    # 长江电力 0.28%、中国神华 0.14%、工商银行 0.09%，但成交额都在 10-21 亿。
    # 原先的 0.4% 把最典型的红利防守股挡在门外，与本策略「蓝筹收益」的定位矛盾。
    # 流动性由 amount_min（1.2 亿）保证。
    volume_ratio_min: 0.6
    change_pct_min: -3.0
    change_pct_max: 4.0
    price_min: 3
    # 刻意不设 price_max：股价水平不承载流动性信息。实测 220 元以上的 74 只票
    # 全部通过各策略的 amount_min，而该上限会挡掉 49 只 500 亿以上的大盘股
    # （宁德时代、贵州茅台、中际旭创、寒武纪、北方华创……）。流动性由
    # amount_min + market_cap_min 表达。
    # 注意：A 股 100 股/手，贵州茅台一手约 13 万元——这是仓位约束，
    # 属于组合层面，不该塞进选股硬筛。
  tech_weight: 0.18
  factor_weights:
    value: 0.30
    stability: 0.26
    liquidity: 0.18
    size: 0.12
    activity: 0.06
    momentum: 0.05
    reversal: 0.03
  scoring_profile:
    # 行业中性化：value / liquidity / size 三个分位类因子改为行业内排名。
    # 去掉 turnover_rate_min 之后，超大盘银行（工商/农业/中国/建设）全部进入候选池，
    # 全市场口径下它们凭低 PE 垄断 value 因子，实测 Top 8 里 7 只是银行。
    # 行业内重排后降到 0-1 只，且分布回到保险/建筑/电力设备/家电等多个行业。
    industry_neutral: true
    industry_neutral_min_size: 10
    momentum_chase_start_pct: 2.8
    momentum_chase_penalty_slope: 18.0
    momentum_downside_start_pct: -3.0
    activity_ideal_volume_ratio: 1.1
    activity_ideal_turnover_rate: 1.8
    activity_high_volume_ratio: 3.5
    activity_high_turnover_rate: 7.0
    stability_hot_change_pct: 4.0
    stability_high_turnover_rate: 7.0
    stability_high_volume_ratio: 3.5
  risk_profile:
    chase_change_pct: 4.8
    abnormal_volume_ratio: 3.5
    high_turnover_rate: 8.0
    invalid_pe_points: 8.0
    high_pb: 4.5
    high_pb_points: 5.0
    low_llm_confidence: 0.45
  portfolio_profile:
    max_same_bucket: 2
    concentration_penalty: 3.0
    buckets:
      金融: [银行, 保险, 券商]
      红利资产: [运营商, 高速, 港口, 公用事业, 煤炭, 电力]
      消费蓝筹: [白酒, 食品, 家电, 消费]
      制造龙头: [工程机械, 汽车, 电气设备, 高端制造]
  scorecard_profile:
    value_quality_value_min: 74.0
    value_quality_stability_min: 70.0
    value_quality_bonus: 2.5
    low_llm_confidence: 0.45
    low_llm_confidence_penalty: 1.0
    volume_spike_ratio: 3.5
    volume_spike_penalty: 1.5
  ranking_hints: |
    优先关注：
    1. 大市值、高成交额且估值没有明显透支的蓝筹或红利资产
    2. 成交与换手稳定，不依赖单日脉冲量能或短线题材拉升
    3. 行业地位、现金流、分红稳定性或防守属性能解释持有逻辑
  max_output: 5

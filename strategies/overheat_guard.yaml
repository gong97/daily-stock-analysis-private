# Overheat Guard Strategy / 过热风险
#
# 规则来自 Macd-Qlib-Analyzer 仓库已确认成立的检验（docs/research-workflow.md「已经确认成立的」）：
#   - 高位乖离过大 / 高位放量急拉之后跑输：scripts/turning_point_confirm.py，2023~2026 确认段
#     A t -6.24、B t -6.60（置换门槛 2.58），14 个季度里 13/14 个跑输；持有 10 日
#   - 高位高换手之后跑输：signal_detector.skill_3_high_turnover_risk；大盘股门槛 10% 见
#     scripts/large_cap_turnover_threshold.py（大盘档 t -5.17，置换门槛 -3.94，24/26 季度为负）
#   - 估值最贵一组跑输：scripts/value_factor_eval.py，最贵 20% 超额中位 -0.92%（t -3.32）；持有 20 日
# 检验口径是「相对当天同一股票池的中位数」，所以这些规则说的是「大概率比别的票差」，不是「会跌」。
#
# 规则 1~3 由程序按检验口径逐字计算（src/overheat_flags.py），以「过热风险旗标」表格写进提示词，
# 与检验的差异只有一处：换手常态用成交量之比代替（股本不变时严格相等），详见该文件。
# 规则 4 是全市场横截面分组，单只股票算不出，只能由模型定性判断。

name: overheat_guard
display_name: 过热风险
description: 用已检验成立的高位过热、高位高换手、估值最贵三类信号识别之后大概率跑输的票，用于拦住追高并提示减仓。
category: framework
core_rules: [1]
required_tools:
  - get_realtime_quote
  - analyze_trend
  - get_stock_info
aliases: [过热, 追高风险, 不追高]
default_priority: 20

instructions: |
  **过热风险（Overheat Guard）**

  这是风险约束，不是选股策略：它只负责指出「接下来大概率比同类股票差」的情形，
  不用它来寻找买点。

  规则 1~3 由程序按历史检验口径算好，见提示词中的「过热风险旗标」表格。
  **直接引用表格结论，不要自行重算、放宽或改判**：

  1. **A 高位乖离过大**：高位日（收盘 ≥ 近 60 日最高收盘 × 0.95）且收盘高于 MA20 超过 11.14%。
  2. **B 高位放量急拉**：高位日，且成交量超过自身前 120 日中位数的 2.95 倍，且当日涨幅 > 3.38%。
  3. **C 高位高换手**：换手率 > 15%（流通市值 ≥ 100 亿时 > 10%），当日涨幅 < 7%，
     且收盘 > 近 60 日最高收盘 × 0.8。
  4. **估值最贵一档**：亏损（PE 为负），或 PE / PB 明显处于全市场最贵的一档。
     这一条由你定性判断，必须写明依据，拿不准时不算触发。

  如果提示词里没有「过热风险旗标」表格，规则 1~3 一律标 ❓ 数据缺失，不要凭现价和均线自行推算。

  必须在报告中逐条写出检查结果（✅ 未触发 / ⚠️ 触发 / ❓ 数据缺失），不能省略。

  处理规则：
  - 触发任意一条：不得给出买入或加仓；`sentiment_score` 不高于 59。
  - A、B 同时触发（历史上最强的组合）：持仓者建议减仓，`sentiment_score -10`。
  - 只触发 C 或第 4 条：持仓者建议「不加仓、设好止损」，单独这一条不足以判卖出。
  - 这些规则说的是「相对跑输」而非「必然下跌」，措辞里不要写成「将会下跌」。

  评分调整建议：
  - A、B 同时触发：`sentiment_score -10`
  - 其余任意一条触发：`sentiment_score` 上限 59

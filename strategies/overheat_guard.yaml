# Overheat Guard Strategy / 过热风险
#
# 规则来自 Macd-Qlib-Analyzer 仓库已确认成立的检验（docs/research-workflow.md「已经确认成立的」）：
#   - 高位乖离过大 / 高位过热之后跑输：scripts/turning_point_confirm.py，2023~2026 确认段
#     A t -6.24、B t -6.60（置换门槛 2.58），14 个季度里 13/14 个跑输；持有 10 日
#   - 大盘股高位高换手之后跑输：scripts/large_cap_turnover_threshold.py，流通市值 >= 100 亿
#     时换手率 > 10%，t -5.17（置换门槛 -3.94），26 个季度里 24 个为负；持有 10 日
#   - 估值最贵一组跑输：scripts/value_factor_eval.py，最贵 20% 超额中位 -0.92%（t -3.32）；持有 20 日
# 检验口径是「相对当天同一股票池的中位数」，所以这些规则说的是「大概率比别的票差」，不是「会跌」。
#
# 与检验定义的差异（本项目 CI 每只股票只拉约 42 根日线，拿不到 60 日最高价和 120 日换手常态）：
#   - 规则 1 用「60 日涨跌幅为正」近似检验里的「收盘 >= 近 60 日最高收盘 × 0.95」
#   - 规则 2 用「量比」（对比近 5 日均量）近似检验里的「换手 / 自身 120 日中位数」
#   - 规则 3 省略了「收盘 > 近 60 日最高 × 0.8」这条宽松条件，其余与检验一致
#   - 规则 4 检验是全市场横截面分组，这里只能由模型定性判断
# 这些近似版本本身没有被检验过，效果以 data/signal_log 的前瞻检验为准。

name: overheat_guard
display_name: 过热风险
description: 用已检验成立的高位过热、大盘股高位高换手、估值最贵三类信号识别之后大概率跑输的票，用于拦住追高并提示减仓。
category: framework
core_rules: [1]
required_tools:
  - get_realtime_quote
  - analyze_trend
  - get_stock_info
aliases: [过热, 追高风险, 不追高]
default_priority: 20

instructions: |
  **过热风险（Overheat Guard）**

  这是风险约束，不是选股策略：它只负责指出「接下来大概率比同类股票差」的情形，
  不用它来寻找买点。下面的阈值来自历史检验，请按数字执行，不要自行放宽。

  逐条检查（使用提示词中的现价、MA20、60日涨跌幅、量比、换手率、当日涨跌幅、流通市值、估值数据）：

  1. **高位乖离过大**：现价高于 MA20 超过 11%（现价 / MA20 − 1 > 0.11），且 60 日涨跌幅为正。
  2. **高位放量急拉**：60 日涨跌幅为正，且量比 ≥ 3，且当日涨幅 > 3.4%。
  3. **高位高换手**：
     - 流通市值 ≥ 100 亿元：换手率 > 10%，且当日涨幅 < 7%；
     - 流通市值 < 100 亿元：换手率 > 15%，且当日涨幅 < 7%。
  4. **估值最贵一档**：亏损（PE 为负），或 PE / PB 明显处于全市场最贵的一档。
     这一条只能定性判断，必须写明依据，拿不准时不算触发。

  必须在报告中逐条写出检查结果（✅ 未触发 / ⚠️ 触发 / ❓ 数据缺失），不能省略。

  处理规则：
  - 触发任意一条：不得给出买入或加仓；`sentiment_score` 不高于 59。
  - 同时触发第 1、2 条（历史上最强的组合）：持仓者建议减仓，`sentiment_score -10`。
  - 只触发第 3 或第 4 条：持仓者建议「不加仓、设好止损」，单独这一条不足以判卖出。
  - 这些规则说的是「相对跑输」而非「必然下跌」，措辞里不要写成「将会下跌」。
  - 数据缺失的条目按未触发处理，但要标 ❓，不得凭印象补数。

  评分调整建议：
  - 第 1、2 条同时触发：`sentiment_score -10`
  - 其余任意一条触发：`sentiment_score` 上限 59
